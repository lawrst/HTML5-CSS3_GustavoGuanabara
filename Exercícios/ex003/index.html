<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teste com Imagens</title>
  </head>
  <body>
    <h1>Testando carga e Imagens</h1>
    <p>Abaixo você vai ver uma imagem que está na mesma pasta (ex003):</p>
    <img src="logo-html5.png" alt="Logo HTML5" />
    <p>Podemos carregar imagens que estão em sub-pastas de ex003:</p>
    <img src="imagens/logo-css3.png" alt="Logo CSS3" />
    <p>Também podemos carregar imagens externas sem precisar baixá-las:</p>
    <img
      src="https://cdn.iconscout.com/icon/free/png-256/free-javascript-icon-svg-download-png-225993.png"
      alt="Logo JavaScript"
    />
    <!-- URL -->
  </body>
</html>
