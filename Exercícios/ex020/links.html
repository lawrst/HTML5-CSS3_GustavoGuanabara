<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Links</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }

      a {
        color: red;
        text-decoration: none;
        font-weight: bold;
      }

      a:visited {
        color: darkred;
      }

      a:hover {
        color: black;
        text-decoration: underline;
      }

      a:active {
        color: blue;
      }

      a::after {
        content: " [link]";
        text-decoration: none;
        color: darkgrey;
        font-weight: normal;
      }

      .especial::after {
        content: " FIM!";
      }
    </style>
  </head>
  <body>
    <h1>Personalizando links</h1>
    <ul>
      <li>
        <a href="https://github.com/lawrst" target="_blank"
          >Repositório GitHub</a
        >
      </li>
      <li>
        <a
          href="https://www.youtube.com/@sadfeelings"
          target="_blank"
          class="especial"
          >Canal do YouTube</a
        >
      </li>
      <li>
        <a href="https://www.cursoemvideo.com" target="_blank"
          >Site do Curso em Vídeo</a
        >
      </li>
    </ul>
  </body>
</html>
