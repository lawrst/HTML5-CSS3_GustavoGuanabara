<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício de Tabelas</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }

      table {
        width: 500px;
        border-collapse: collapse;
      }

      caption {
        font-size: 1.3em;
        font-weight: bolder;
        padding: 8px;
      }

      th,
      td {
        border: 1px solid black;
        padding: 8px;
      }

      col.cnome {
        background-color: yellow;
      }

      col.csexo {
        background-color: purple;
      }
    </style>
  </head>
  <body>
    <h1>Exercício de Tabelas</h1>

    <table>
      <colgroup>
        <col class="cnome" />
        <col class="csexo" span="3" />
      </colgroup>

      <caption>
        Cadastro
      </caption>
      <tr>
        <th>Nome</th>
        <th>Sexo</th>
        <th>Idade</th>
        <th>Profissão</th>
      </tr>

      <tr>
        <td>Ana Maria</td>
        <td>F</td>
        <td>25</td>
        <td>Jornalista</td>
      </tr>
      <tr>
        <td>Cláudio</td>
        <td>M</td>
        <td>32</td>
        <td>Carpinteiro</td>
      </tr>
      <tr>
        <td>Jones Mário</td>
        <td>M</td>
        <td>54</td>
        <td>Professor</td>
      </tr>
      <tr>
        <td>Carlos Albert</td>
        <td>M</td>
        <td>30</td>
        <td>Escritor</td>
      </tr>
      <tr>
        <td>Maria Lívia</td>
        <td>F</td>
        <td>19</td>
        <td>Estudante</td>
      </tr>
    </table>
  </body>
</html>
