<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fontes com Google Fonts</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kaushan+Script&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap");

      @font-face {
        font-family: love larry;
        src: url(fontes/love\ larry\ ttf.ttf) format(truetype);
      }

      body {
        font-family: "love larry";
        font-size: 16px;
        font-weight: normal;
        color: black;
      }

      h1 {
        font-family: "Kaushan Script", sans-serif;
        font-size: 3em;
      }

      h2 {
        font-family: "Kaushan Script";
        font-size: 2em;
      }
    </style>
  </head>

    <h1>Título</h1>
    <p>
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Sit eius rem

      ipsam, omnis aspernatur, sint quos nulla similique?
    </p>
    <h2>Subtítulo</h2>
  </body>
</html>
