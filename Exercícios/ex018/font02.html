<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fontes Externas</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Berkshire+Swash&display=swap");

      @font-face {
        font-family: "love larry";
        src: url("fontes/love\ larry\ ttf.ttf") format(truetype);
        font-weight: normal;
        font-style: normal;

        /* Tipos de Format
          - opentype (otf)
          - truetype (ttf)
          - embedded-opentype
          - truetype-aat (Apple Advanced Typography)
          - svg
        */

        /* é bom colocar os dois tipos (otf/ttf) */
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
      }

      h1 {
        font-family: "love larry";
        font-size: 3em;
        font-weight: normal;
      }

      h2 {
        font-family: "Berkshire Swash";
        font-weight: lighter;
        font-size: 2em;
      }
    </style>
  </head>
  <body>
    <h1>Olá, Mundo!</h1>
    <p>
      Lorem ipsum dolor sit, amet consectetur adipisicing elit. Recusandae
      exercitationem error natus quaerat tempora, soluta deserunt delectus
      adipisci laboriosam necessitatibus distinctio nihil quo assumenda incidunt
      officiis. Ad obcaecati quos commodi!
    </p>
    <h2>Teste de fonte</h2>
  </body>
</html>
